name: Zero-Cost Business Autonomous Loop

on:
  schedule:
    # Every 30 minutes — the agent spreads its daily LLM budget across the whole day.
    # GitHub Actions cron can be delayed 5-15 min during high load; this is fine.
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allow manual trigger from Actions tab

# Prevent overlapping runs — if a previous run is still going, the new one
# waits (or replaces pending runs). Since runs are short (1-5 min) and the
# schedule is 30 min, overlap is rare.
concurrency:
  group: agent-loop
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run agent (agentic loop with budget management)
        run: python3 agent.py
        env:
          # LLM provider keys — set ANY subset of these as repo secrets.
          # Recommended: at minimum GROQ_API_KEY and GEMINI_API_KEY.
          # The agent tries providers in priority order and tracks daily
          # budget per provider, spreading usage across the whole day.
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY:    ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY:   ${{ secrets.SAMBANOVA_API_KEY }}
          CF_API_TOKEN:        ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID:       ${{ secrets.CF_ACCOUNT_ID }}
          HF_TOKEN:            ${{ secrets.HF_TOKEN }}
        continue-on-error: true

      - name: Show run summary
        if: always()
        run: |
          echo "=== Last state ==="
          cat memory/state.md 2>/dev/null || echo "(no state.md)"
          echo ""
          echo "=== Budget ==="
          cat memory/budget.md 2>/dev/null || echo "(no budget.md)"
          echo ""
          echo "=== Blocked items ==="
          cat memory/blocked.md 2>/dev/null || echo "(no blocked.md)"

      - name: Commit & push changes
        run: |
          git config --local user.email "autonomous@ai-business.local"
          git config --local user.name "Zero-Cost AI Agent"
          # Commit docs/ (the website) + memory/ (agent state) + prompts/
          git add memory/ docs/ prompts/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Autonomous run: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}
          fi
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        continue-on-error: true
