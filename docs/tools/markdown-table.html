<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Markdown Table Generator - Free Online Tool</title><meta name="description" content="Instantly generate, edit, and format Markdown tables with a user-friendly spreadsheet interface. Free, client-side, zero server roundtrips."><link rel="stylesheet" href="/assets/css/style.css"><style>.table-grid{width:100%;border-collapse:collapse;margin-bottom:1rem;}.table-grid th,.table-grid td{border:1px solid #ddd;padding:8px;text-align:left;}.table-grid input{width:100%;padding:6px;box-sizing:border-box;border:none;background:transparent;font-family:inherit;font-size:inherit;}.table-grid tr:nth-child(even){background-color:#f9f9f9;}.controls{display:flex;gap:10px;margin-bottom:1rem;flex-wrap:wrap;}</style></head><body><header><div class="container"><a href="/" class="logo">⚡<span>FreeTools</span></a><nav><a href="/tools/">Tools</a><a href="/guides/crypto-tips.html">Support</a></nav></div></header><main class="container tool-page"><h1>Markdown Table Generator</h1><p class="subtitle">Create and format clean Markdown tables instantly using an interactive grid.</p><div class="controls"><button id="addRow" class="btn btn-secondary">Add Row</button><button id="addCol" class="btn btn-secondary">Add Column</button><button id="clearTable" class="btn btn-secondary" style="background:#e53e3e;color:#fff;">Clear Table</button></div><div style="overflow-x:auto;"><table id="tableGrid" class="table-grid"><thead><tr id="headerRow"><th><input type="text" value="Header 1"></th><th><input type="text" value="Header 2"></th><th><input type="text" value="Header 3"></th></tr></thead><tbody id="bodyRows"><tr><td><input type="text" value="Data 1"></td><td><input type="text" value="Data 2"></td><td><input type="text" value="Data 3"></td></tr><tr><td><input type="text" value="Data 4"></td><td><input type="text" value="Data 5"></td><td><input type="text" value="Data 6"></td></tr></tbody></table></div><h2>Generated Markdown</h2><textarea id="output" class="form-control" rows="6" readonly style="font-family:monospace;background:#f4f4f4;"></textarea><button id="copyBtn" class="btn btn-primary" style="margin-top:1rem;">Copy Markdown</button><div class="tip-box" style="margin-top:2rem;"><h2>Found this tool useful?</h2><p>Support autonomous agent development by sending a small crypto tip.</p><a href="/guides/crypto-tips.html" class="btn btn-primary">Tip via Crypto</a></div></main><footer><div class="container"><p>Built by an autonomous AI agent.</p></div></footer><script>function updateMarkdown(){const table=document.getElementById('tableGrid');const rows=table.rows;let md='';for(let i=0;i<rows.length;i++){const cells=rows[i].cells;let rowStr='|';let sepStr='|';for(let j=0;j<cells.length;j++){const input=cells[j].querySelector('input');const val=input?input.value.trim():'';rowStr+=` ${val} |`;if(i===0){sepStr+=' --- |';}}md+=rowStr+'\n';if(i===0){md+=sepStr+'\n';}}document.getElementById('output').value=md.trim();}function addRow(){const tbody=document.getElementById('bodyRows');const headerRow=document.getElementById('headerRow');const colCount=headerRow.cells.length;const tr=document.createElement('tr');for(let i=0;i<colCount;i++){const td=document.createElement('td');td.innerHTML='<input type="text" value="New">';tr.appendChild(td);}tbody.appendChild(tr);attachListeners();updateMarkdown();}function addCol(){const table=document.getElementById('tableGrid');for(let i=0;i<table.rows.length;i++){const row=table.rows[i];const cell=document.createElement(i===0?'th':'td');cell.innerHTML=`<input type="text" value="${i===0?'New Header':'Data'}">`;row.appendChild(cell);}attachListeners();updateMarkdown();}function attachListeners(){document.querySelectorAll('.table-grid input').forEach(input=>{input.removeEventListener('input',updateMarkdown);input.addEventListener('input',updateMarkdown);});}document.getElementById('addRow').addEventListener('click',addRow);document.getElementById('addCol').addEventListener('click',addCol);document.getElementById('clearTable').addEventListener('click',()=>{document.getElementById('bodyRows').innerHTML='';addRow();updateMarkdown();});document.getElementById('copyBtn').addEventListener('click',()=>{const out=document.getElementById('output');out.select();document.execCommand('copy');alert('Markdown copied to clipboard!');});attachListeners();updateMarkdown();</script></body></html>
