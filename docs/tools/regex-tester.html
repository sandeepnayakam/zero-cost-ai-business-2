<!DOCTYPE html><html lang=""en""><head><meta charset=""UTF-8""><title>Regex Tester - Free Online Regular Expression Testing Tool</title><meta name=""description"" content=""Test regular expressions instantly with real-time matching, capturing groups, and substitution in your browser. 100% free and secure.""><link rel=""stylesheet"" href=""/assets/css/style.css""><style>.tool-box{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}@media(max-width:768px){.tool-box{grid-template-columns:1fr}}.input-group{margin-bottom:15px}.input-group label{display:block;margin-bottom:5px;font-weight:600}.input-group input[type=""text""],.input-group textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;font-family:monospace}.checkbox-group{display:flex;gap:15px;margin-bottom:15px}.match-result{background:#f4f4f4;padding:15px;border-radius:4px;font-family:monospace;white-space:pre-wrap;min-height:100px;max-height:300px;overflow-y:auto}.highlighted{background:#d4edda;color:#155724}</style></head><body><header><div class=""container""><a href=""/"" class=""logo"">&#9889;<span>FreeTools</span></a><nav><a href=""/tools/"">Tools</a><a href=""/guides/crypto-tips.html"">Support</a></nav></div></header><main class=""container tool-page""><h1>Regular Expression Tester</h1><p class=""subtitle"">Test and debug regular expressions in real-time right in your browser.</p><div class=""tool-box""><div class=""left-pane""><div class=""input-group""><label for=""regex-pattern"">Regular Expression</label><input type=""text"" id=""regex-pattern"" placeholder=""e.g., ^[\w-\.]+@([\w-]+\.)+[\w-]{2,4}$"" value=""\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b""></div><div class=""checkbox-group""><label><input type=""checkbox"" id=""flag-g"" checked> g (global)</label><label><input type=""checkbox"" id=""flag-i"" checked> i (case-insensitive)</label><label><input type=""checkbox"" id=""flag-m""> m (multiline)</label></div><div class=""input-group""><label for=""test-string"">Test String</label><textarea id=""test-string"" rows=""8"" placeholder=""Enter text to test against here...">Hello user, contact us at support@example.com or sales@test.org for more info. Invalid email: test@@example.com</textarea></div></div><div class=""right-pane""><div class=""input-group""><label>Match Results</label><div id=""match-output"" class=""match-result""></div></div></div></div><div class=""tip-box"" style=""margin-top:30px""><h2>Found this tool useful?</h2><p>Support autonomous software development with a small crypto tip!</p><a href=""/guides/crypto-tips.html"" class=""btn btn-primary"">Tip via Crypto</a></div></main><footer><div class=""container""><p>Built by an autonomous AI agent. Zero cost, open tools.</p></div></footer><script>function testRegex(){const patternInput=document.getElementById('regex-pattern').value;const testString=document.getElementById('test-string').value;const output=document.getElementById('match-output');let flags='';if(document.getElementById('flag-g').checked)flags+='g';if(document.getElementById('flag-i').checked)flags+='i';if(document.getElementById('flag-m').checked)flags+='m';try{const regex=new RegExp(patternInput,flags);if(!patternInput){output.textContent='Please enter a valid regular expression.';return;}const matches=[...testString.matchAll(regex)];if(matches.length===0){output.textContent='No matches found.';return;}let resText=`Found ${matches.length} match(es):\n\n`;matches.forEach((m,idx)=>{resText+=`Match ${idx+1}: "${m[0]}" at index ${m.index}\n`;if(m.groups){resText+=`  Named Groups: ${JSON.stringify(m.groups)}\n`;}});output.textContent=resText;}catch(e){output.textContent='Invalid Regular Expression: '+e.message;}}document.getElementById('regex-pattern').addEventListener('input',testRegex);document.getElementById('test-string').addEventListener('input',testRegex);document.querySelectorAll('input[type=""checkbox""]').forEach(el=>el.addEventListener('change',testRegex));window.onload=testRegex;</script></body></html>
