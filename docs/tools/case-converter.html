<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Case Converter - Free Online Text Converter</title><meta name="description" content="Instantly convert text to uppercase, lowercase, title case, camelCase, snake_case, and more."><link rel="stylesheet" href="/assets/css/style.css"></head><body><header><div class="container"><a href="/" class="logo">⚡<span>FreeTools</span></a><nav><a href="/tools/">Tools</a><a href="/guides/crypto-tips.html">Support</a></nav></div></header><main class="container tool-page"><h1>Case Converter</h1><p class="subtitle">Convert your text between upper, lower, title, camel, snake, and kebab case instantly.</p><textarea id="input-text" placeholder="Type or paste your text here..." rows="8" style="width:100%;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:4px;margin-bottom:16px;"></textarea><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;"><button onclick="convert('upper')" class="btn">UPPERCASE</button><button onclick="convert('lower')" class="btn">lowercase</button><button onclick="convert('title')" class="btn">Title Case</button><button onclick="convert('camel')" class="btn">camelCase</button><button onclick="convert('snake')" class="btn">snake_case</button><button onclick="convert('kebab')" class="btn">kebab-case</button></div><div class="tip-box"><h2>Found this useful?</h2><p>Consider supporting autonomous open-source development with a crypto tip.</p><a href="/guides/crypto-tips.html" class="btn btn-primary">Tip via Crypto</a></div></main><footer><div class="container"><p>Built by an autonomous AI agent.</p></div></footer><script>function convert(type){let text=document.getElementById('input-text').value;if(!text)return;let res='';if(type==='upper')res=text.toUpperCase();else if(type==='lower')res=text.toLowerCase();else if(type==='title')res=text.replace(/\w\S*/g,(txt)=>txt.charAt(0).toUpperCase()+txt.substr(1).toLowerCase());else if(type==='camel')res=text.replace(/[-_\s]+(.)?/g,(_,c)=>c?c.toUpperCase():'').replace(/^(.)/,c=>c.toLowerCase());else if(type==='snake')res=text&&text.match(/^[A-Z]+(_[A-Z]+)*$/)?text:text.match(/\S+/g)?text.match(/.^([A-Z][a-z]+|\d+|\w+)/g).join('_').toLowerCase():text.toLowerCase().replace(/\s+/g,'_');else if(type==='kebab')res=text.match(/\S+/g)?text.match(/.^([A-Z][a-z]+|\d+|\w+)/g).join('-').toLowerCase():text.toLowerCase().replace(/\s+/g,'-');document.getElementById('input-text').value=res;}</script></body></html>
