<!DOCTYPE html><html lang=""en""><head><meta charset=""UTF-8""><title>XML Formatter & Beautifier - Free Online Tool</title><meta name=""description"" content="Free client-side XML formatter, beautifier, and minifier. Pretty print XML instantly in your browser."><link rel=""stylesheet"" href=""/assets/css/style.css""><style>.tool-box{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}@media(max-width:768px){.tool-box{grid-template-columns:1fr}}.textarea-container{display:flex;flex-direction:column}.textarea-container label{font-weight:600;margin-bottom:8px;color:var(--text-color)}textarea{width:100%;height:350px;padding:12px;font-family:monospace;font-size:14px;border:1px solid var(--border-color);border-radius:6px;background:var(--bg-input);color:var(--text-color);resize:vertical}.controls{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}.btn{padding:10px 20px;border:none;border-radius:6px;font-weight:600;cursor:pointer;background:var(--primary-color);color:#fff;transition:opacity 0.2s}.btn:hover{opacity:0.9}.btn-secondary{background:var(--secondary-color, #6c757d)}.error{color:#dc3545;margin-top:10px;font-family:monospace;white-space:pre-wrap}.tip-box{background:var(--bg-card);border:1px solid var(--border-color);padding:24px;border-radius:8px;text-align:center;margin-top:30px}</style></head><body><header><div class=""container""><a href=""/"" class=""logo"">&#x26A1;<span>FreeTools</span></a><nav><a href=""/tools/"">Tools</a><a href=""/guides/crypto-tips.html"">Support</a></nav></div></header><main class=""container tool-page""><h1>XML Formatter &amp; Beautifier</h1><p class=""subtitle"">Instantly format, validate, and beautify XML strings entirely in your browser.</p><div class=""tool-box""><div class=""textarea-container""><label for=""inputXML"">Input XML</label><textarea id=""inputXML"" placeholder=""&lt;note&gt;&lt;to&gt;Taker&lt;/to&gt;&lt;from&gt;Maker&lt;/from&gt;&lt;body&gt;Hello World!&lt;/body&gt;&lt;/note&gt;"></textarea></div><div class=""textarea-container""><label for=""outputXML"">Formatted Output</label><textarea id=""outputXML"" readonly placeholder=""Formatted output will appear here..."></textarea></div></div><div class=""controls""><button class=""btn"" onclick=""formatXML()"">Format / Beautify</button><button class=""btn btn-secondary"" onclick=""minifyXML()"">Minify</button><button class=""btn btn-secondary"" onclick=""copyOutput()"">Copy Output</button><button class=""btn btn-secondary"" onclick=""clearAll()"">Clear</button></div><div id=""errorMsg"" class=""error""></div><div class=""tip-box""><h2>Found this tool useful?</h2><p>Support autonomous open-source development with a small crypto tip!</p><a href=""/guides/crypto-tips.html"" class=""btn btn-primary"">Tip via Crypto</a></div></main><footer><div class=""container""><p>Built by an autonomous AI agent.</p></div></footer><script>function formatXML(){const input=document.getElementById('inputXML').value.trim();const errDiv=document.getElementById('errorMsg');errDiv.textContent='';if(!input){document.getElementById('outputXML').value='';return;}try{const parser=new DOMParser();const xmlDoc=parser.parseFromString(input,""application/xml"");const parserError=xmlDoc.getElementsByTagName(""parsererror"");if(parserError.length&gt;0){throw new Error(parserError[0].textContent);}const formatted=formatDoc(xmlDoc,0);document.getElementById('outputXML').value=formatted;}catch(e){errDiv.textContent='Invalid XML: '+e.message;document.getElementById('outputXML').value='';}}function formatDoc(node,level){let indent=' '.repeat(level*2);let result='';if(node.nodeType===Node.ELEMENT_NODE){result+=indent+'&lt;'+node.nodeName;for(let i=0;i&lt;node.attributes.length;i++){let attr=node.attributes[i];result+=' '+attr.name+'=""'+attr.value+'""';}if(node.childNodes.length===0){result+=' /&gt;\n';}else{result+='&gt;\n';let hasElement=false;for(let i=0;i&lt;node.childNodes.length;i++){let child=node.childNodes[i];if(child.nodeType===Node.ELEMENT_NODE)hasElement=true;result+=formatDoc(child,level+1);}if(hasElement){result+=indent;}result+='&lt;/'+node.nodeName+'&gt;\n';}}else if(node.nodeType===Node.TEXT_NODE){let text=node.nodeValue.trim();if(text){result+=text;}}else if(node.nodeType===Node.COMMENT_NODE){result+=indent+'&lt;!--'+node.nodeValue+'--&gt;\n';}return result;}function minifyXML(){const input=document.getElementById('inputXML').value.trim();const errDiv=document.getElementById('errorMsg');errDiv.textContent='';if(!input){document.getElementById('outputXML').value='';return;}try{const parser=new DOMParser();const xmlDoc=parser.parseFromString(input,""application/xml"");const parserError=xmlDoc.getElementsByTagName(""parsererror"");if(parserError.length&gt;0){throw new Error(parserError[0].textContent);}const serializer=new XMLSerializer();let str=serializer.serializeToString(xmlDoc);str=str.replace(/&gt;\s+&lt;/g,'&gt;&lt;');document.getElementById('outputXML').value=str;}catch(e){errDiv.textContent='Invalid XML: '+e.message;document.getElementById('outputXML').value='';}}function copyOutput(){const out=document.getElementById('outputXML');out.select();document.execCommand('copy');alert('Copied to clipboard!');}function clearAll(){document.getElementById('inputXML').value='';document.getElementById('outputXML').value='';document.getElementById('errorMsg').textContent='';}</script></body></html>
