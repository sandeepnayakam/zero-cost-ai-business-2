<!DOCTYPE html><html><head><meta charset="UTF-8"><title>JSON Beautifier & Minifier - Free Online Developer Tool</title><meta name="description" content="Instantly format, beautify, and minify JSON data client-side with syntax highlighting and validation."><link rel="stylesheet" href="/assets/css/style.css"><style>.tool-box{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}@media(max-width:768px){.tool-box{grid-template-columns:1fr}}.textarea-group{display:flex;flex-direction:column}.textarea-group label{font-weight:600;margin-bottom:8px}.textarea-group textarea{width:100%;height:350px;padding:12px;font-family:monospace;font-size:14px;border:1px solid #ccc;border-radius:6px;resize:vertical}.btn-group{margin:15px 0;display:flex;gap:10px;flex-wrap:wrap}.error-msg{color:#d32f2f;font-weight:600;margin-top:10px}.success-msg{color:#388e3c;font-weight:600;margin-top:10px}</style></head><body><header><div class="container"><a href="/" class="logo">⚡<span>FreeTools</span></a><nav><a href="/">Home</a><a href="/guides/crypto-tips.html">Support</a></nav></div></header><main class="container tool-page"><h1>JSON Beautifier & Minifier</h1><p class="subtitle">Format, validate, and minify your JSON instantly in your browser.</p><div class="tool-box"><div class="textarea-group"><label for="inputJson">Input JSON</label><textarea id="inputJson" placeholder="Paste your raw JSON here..."></textarea></div><div class="textarea-group"><label for="outputJson">Output JSON</label><textarea id="outputJson" placeholder="Formatted output appears here..." readonly></textarea></div></div><div class="btn-group"><button class="btn btn-primary" onclick="formatJson(2)">Beautify (2 Spaces)</button><button class="btn btn-primary" onclick="formatJson(4)">Beautify (4 Spaces)</button><button class="btn btn-secondary" onclick="minifyJson()">Minify</button><button class="btn btn-secondary" onclick="copyOutput()">Copy Output</button><button class="btn btn-secondary" onclick="clearAll()">Clear</button></div><div id="statusMessage"></div><div class="tip-box" style="margin-top:40px;"><h2>Found this tool useful?</h2><p>This zero-cost platform runs on developer utilities. Support our work by leaving a small crypto tip!</p><a href="/guides/crypto-tips.html" class="btn btn-primary">Tip via Crypto</a></div></main><footer><div class="container"><p>Built by an autonomous AI agent.</p></div></footer><script>function formatJson(spaces){const input=document.getElementById('inputJson').value;const status=document.getElementById('statusMessage');if(!input.trim()){document.getElementById('outputJson').value='';status.innerHTML='';return;}try{const parsed=JSON.parse(input);document.getElementById('outputJson').value=JSON.stringify(parsed,null,spaces);status.innerHTML='<p class="success-msg">Valid JSON!</p>';}catch(e){status.innerHTML='<p class="error-msg">Invalid JSON: '+e.message+'</p>';}}function minifyJson(){const input=document.getElementById('inputJson').value;const status=document.getElementById('statusMessage');if(!input.trim()){document.getElementById('outputJson').value='';status.innerHTML='';return;}try{const parsed=JSON.parse(input);document.getElementById('outputJson').value=JSON.stringify(parsed);status.innerHTML='<p class="success-msg">Valid JSON (Minified)!</p>';}catch(e){status.innerHTML='<p class="error-msg">Invalid JSON: '+e.message+'</p>';}}function copyOutput(){const output=document.getElementById('outputJson');output.select();document.execCommand('copy');alert('Copied to clipboard!');}function clearAll(){document.getElementById('inputJson').value='';document.getElementById('outputJson').value='';document.getElementById('statusMessage').innerHTML='';}</script></body></html>
