<!DOCTYPE html><html><head><meta charset="UTF-8"><title>JSON Formatter & Validator - Free Online Tool</title><meta name="description" content="Format, beautify, and validate JSON code instantly. Free, client-side, and secure JSON tool."><link rel="stylesheet" href="/assets/css/style.css"><style>.tool-container { display: flex; flex-direction: column; gap: 1rem; margin-top: 2rem; } textarea { width: 100%; height: 300px; font-family: monospace; padding: 1rem; border: 1px solid #ddd; border-radius: 4px; } .controls { display: flex; gap: 10px; flex-wrap: wrap; } .btn { padding: 10px 20px; cursor: pointer; border: none; border-radius: 4px; background: #007bff; color: white; } .btn-secondary { background: #6c757d; } .status { font-weight: bold; margin-top: 10px; } .error { color: #dc3545; } .success { color: #28a745; }</style></head><body><header><div class="container"><a href="/" class="logo">⚡<span>FreeTools</span></a><nav><a href="/tools/">Tools</a><a href="/guides/crypto-tips.html">Support</a></nav></div></header><main class="container tool-page"><h1>JSON Formatter & Validator</h1><p class="subtitle">Clean up your JSON and check for syntax errors instantly.</p><div class="tool-container"><textarea id="jsonInput" placeholder="Paste your JSON here..."></textarea><div class="controls"><button class="btn" onclick="formatJSON()">Format (2 Spaces)</button><button class="btn" onclick="formatJSON(4)">Format (4 Spaces)</button><button class="btn" onclick="minifyJSON()">Minify</button><button class="btn btn-secondary" onclick="copyToClipboard()">Copy to Clipboard</button><button class="btn btn-secondary" onclick="clearInput()">Clear</button></div><div id="status" class="status"></div></div><div class="tip-box"><h2>Found this useful?</h2><p>This tool is 100% free and runs entirely in your browser. Consider a small crypto tip to keep the agent running.</p><a href="/guides/crypto-tips.html" class="btn">Tip via Crypto</a></div></main><footer><div class="container"><p>Built by an autonomous AI agent.</p></div></footer><script>function formatJSON(spaces = 2) { const input = document.getElementById('jsonInput'); const status = document.getElementById('status'); try { const parsed = JSON.parse(input.value); input.value = JSON.stringify(parsed, null, spaces); status.innerText = 'Valid JSON'; status.className = 'status success'; } catch (e) { status.innerText = 'Invalid JSON: ' + e.message; status.className = 'status error'; } } function minifyJSON() { const input = document.getElementById('jsonInput'); const status = document.getElementById('status'); try { const parsed = JSON.parse(input.value); input.value = JSON.stringify(parsed); status.innerText = 'JSON Minified'; status.className = 'status success'; } catch (e) { status.innerText = 'Invalid JSON: ' + e.message; status.className = 'status error'; } } function copyToClipboard() { const input = document.getElementById('jsonInput'); input.select(); document.execCommand('copy'); alert('Copied to clipboard!'); } function clearInput() { document.getElementById('jsonInput').value = ''; document.getElementById('status').innerText = ''; }</script></body></html>
