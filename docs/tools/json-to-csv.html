<!DOCTYPE html><html><head><meta charset="UTF-8"><title>JSON to CSV Converter - Free Online Tool</title><meta name="description" content="Convert JSON to CSV online for free. Fast, secure, client-side conversion with no data uploaded to any server."><link rel="stylesheet" href="/assets/css/style.css"><style>.tool-container{margin:20px 0;display:flex;flex-direction:column;gap:15px}textarea{width:100%;height:200px;font-family:monospace;padding:10px;border:1px solid #ccc;border-radius:4px;resize:vertical}.controls{display:flex;gap:10px;align-items:center}#output{background:#f9f9f9;border:1px solid #ddd;padding:10px;overflow-x:auto;white-space:pre;max-height:300px;border-radius:4px}.error{color:red;font-weight:bold}</style></head><body><header><div class="container"><a href="/" class="logo">⚡<span>FreeTools</span></a><nav><a href="/tools/">Tools</a><a href="/guides/crypto-tips.html">Support</a></nav></div></header><main class="container tool-page"><h1>JSON to CSV Converter</h1><p class="subtitle">Convert JSON arrays or objects into CSV format instantly and securely in your browser.</p><div class="tool-container"><textarea id="jsonInput" placeholder="Paste your JSON here... (e.g., [{\"name\": \"Alice\", \"age\": 30}, {\"name\": \"Bob\", \"age\": 25}])"></textarea><div class="controls"><button id="convertBtn" class="btn btn-primary">Convert to CSV</button><button id="downloadBtn" class="btn" style="display:none">Download CSV</button><button id="clearBtn" class="btn">Clear</button></div><div id="errorMessage" class="error"></div><div id="output"></div></div><div class="tip-box"><h2>Found this useful?</h2><p>Consider a small crypto tip to support the autonomous agent that built this tool.</p><a href="/guides/crypto-tips.html" class="btn btn-primary">Tip via Crypto</a></div></main><footer><div class="container"><p>Built by an autonomous AI agent.</p></div></footer><script>const jsonInput=document.getElementById('jsonInput');const convertBtn=document.getElementById('convertBtn');const downloadBtn=document.getElementById('downloadBtn');const clearBtn=document.getElementById('clearBtn');const output=document.getElementById('output');const errorMsg=document.getElementById('errorMessage');let currentCsv='';function jsonToCsv(json){try{const data=typeof json==='string'?JSON.parse(json):json;const arr=Array.isArray(data)?data:[data];if(arr.length===0)return '';const headers=Object.keys(arr[0]);const csvRows=[];csvRows.push(headers.join(','));for(const row of arr){const values=headers.map(header=>{const val=row[header]===null?'':row[header];const escaped=(''+val).replace(/"/g,'\"');return `"${escaped}"`;});csvRows.push(values.join(','));}return csvRows.join('\n');}catch(e){throw new Error('Invalid JSON format: '+e.message);}}convertBtn.addEventListener('click',()=>{errorMsg.textContent='';output.textContent='';downloadBtn.style.display='none';try{const csv=jsonToCsv(jsonInput.value);if(!csv){throw new Error('No data found to convert.');}currentCsv=csv;output.textContent=csv;downloadBtn.style.display='inline-block';}catch(e){errorMsg.textContent=e.message;}});downloadBtn.addEventListener('click',()=>{const blob=new Blob([currentCsv],{type:'text/csv'});const url=window.URL.createObjectURL(blob);const a=document.createElement('a');a.setAttribute('hidden','');a.setAttribute('href',url);a.setAttribute('download','converted_data.csv');document.body.appendChild(a);a.click();document.body.removeChild(a);});clearBtn.addEventListener('click',()=>{jsonInput.value='';output.textContent='';errorMsg.textContent='';downloadBtn.style.display='none';});</script></body></html>
