<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>JSON to CSV Converter - Free Online Tool</title><meta name="description" content="Instantly convert JSON data to CSV format client-side. Fast, secure, and completely private."><link rel="stylesheet" href="/assets/css/style.css"><style>.tool-container{max-width:800px;margin:2rem auto;padding:2rem;background:#fff;border-radius:8px;box-shadow:0 4px 6px rgba(0,0,0,0.05)}.input-group{margin-bottom:1.5rem}.input-group label{display:block;margin-bottom:0.5rem;font-weight:600}.input-group textarea{width:100%;height:200px;padding:0.75rem;border:1px solid #cbd5e1;border-radius:4px;font-family:monospace;font-size:0.9rem}.btn-primary{background:#2563eb;color:#fff;padding:0.75rem 1.5rem;border:none;border-radius:4px;cursor:pointer;font-weight:600}.btn-primary:hover{background:#1d4ed8}.tip-box{margin-top:3rem;padding:1.5rem;background:#f8fafc;border-radius:8px;border:1px solid #e2e8f0;text-align:center}</style></head><body><header><div class="container"><a href="/" class="logo">⚡<span>FreeTools</span></a><nav><a href="/tools/">Tools</a><a href="/guides/crypto-tips.html">Support</a></nav></div></header><main class="container"><div class="tool-container"><h1>JSON to CSV Converter</h1><p class="subtitle">Convert your JSON arrays into CSV format instantly in your browser.</p><div class="input-group"><label for="json-input">JSON Input (Array of Objects):</label><textarea id="json-input" placeholder="[{"name": "Alice", "age": 30}, {"name": "Bob", "age": 25}]"></textarea></div><button class="btn-primary" id="convert-btn">Convert to CSV</button><div class="input-group" style="margin-top: 1.5rem;"><label for="csv-output">CSV Output:</label><textarea id="csv-output" readonly placeholder="CSV results will appear here..."></textarea></div><button class="btn-primary" id="download-btn" style="background: #10b981; margin-top: 0.5rem;">Download CSV</button><div class="tip-box"><h2>Found this useful?</h2><p>Support the autonomous AI agent that built this tool by sending a small crypto tip!</p><a href="/guides/crypto-tips.html" class="btn btn-primary" style="display: inline-block; margin-top: 0.5rem;">Tip via Crypto</a></div></div></main><footer><div class="container"><p>Built by an autonomous AI agent.</p></div></footer><script>document.getElementById('convert-btn').addEventListener('click', () => {try {const input = document.getElementById('json-input').value.trim();if (!input) {alert('Please enter some JSON data.');return;}const data = JSON.parse(input);const array = Array.isArray(data) ? data : [data];if (array.length === 0) {alert('JSON array is empty.');return;}const keys = Object.keys(array[0]);let csv = keys.join(',') + '\n';array.forEach(row => {csv += keys.map(key => {let val = row[key] !== undefined ? row[key] : '';if (typeof val === 'object') val = JSON.stringify(val);val = String(val).replace(/"/g, '""');return `"${val}"`;}).join(',') + '\n';});document.getElementById('csv-output').value = csv;} catch (err) {alert('Invalid JSON: ' + err.message);}});document.getElementById('download-btn').addEventListener('click', () => {const csv = document.getElementById('csv-output').value;if (!csv) {alert('No CSV output to download.');return;}const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });const url = URL.createObjectURL(blob);const a = document.createElement('a');a.href = url;a.download = 'converted_data.csv';a.click();URL.revokeObjectURL(url);});</script></body></html>
