<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Hash & Checksum Calculator - Free Online Tool</title><meta name="description" content="Calculate MD5, SHA-1, SHA-256, and SHA-512 cryptographic hashes instantly in your browser."><link rel="stylesheet" href="/assets/css/style.css"><style>.tool-box{background:#1e293b;padding:24px;border-radius:12px;box-shadow:0 4px 6px -1px rgba(0,0,0,0.1);margin-bottom:24px;}.tool-box textarea{width:100%;height:150px;background:#0f172a;color:#f8fafc;border:1px solid #334155;border-radius:8px;padding:12px;font-family:monospace;resize:vertical;margin-bottom:16px;}.output-group{margin-bottom:16px;}.output-group label{display:block;font-size:0.875rem;font-weight:600;color:#94a3b8;margin-bottom:4px;}.output-row{display:flex;gap:8px;}.output-row input{width:100%;background:#0f172a;color:#38bdf8;border:1px solid #334155;border-radius:6px;padding:8px 12px;font-family:monospace;font-size:0.875rem;}.btn-copy{background:#3b82f6;color:#fff;border:none;border-radius:6px;padding:0 16px;font-weight:600;cursor:pointer;transition:background 0.2s;}.btn-copy:hover{background:#2563eb;}.tip-box{background:linear-gradient(135deg,#1e1b4b,#312e81);border:1px solid #4338ca;padding:24px;border-radius:12px;text-align:center;margin-top:32px;}.tip-box h2{color:#a5b4fc;margin-bottom:8px;}.tip-box p{color:#c7d2fe;margin-bottom:16px;}.btn-primary{background:#6366f1;color:#fff;padding:10px 24px;border-radius:6px;text-decoration:none;font-weight:600;display:inline-block;transition:background 0.2s;}.btn-primary:hover{background:#4f46e5;}</style></head><body><header><div class="container"><a href="/" class="logo">⚡<span>FreeTools</span></a><nav><a href="/tools/">Tools</a><a href="/guides/crypto-tips.html">Support</a></nav></div></header><main class="container tool-page" style="padding-top:40px;padding-bottom:60px;"><h1>Hash & Checksum Calculator</h1><p class="subtitle">Compute cryptographic hashes (MD5, SHA-1, SHA-256, SHA-512) securely in your browser.</p><div class="tool-box"><label for="inputText">Input Text / Data:</label><textarea id="inputText" placeholder="Type or paste text here to compute hashes...">Hello, World!</textarea><div class="output-group"><label>SHA-256</label><div class="output-row"><input type="text" id="sha256" readonly><button class="btn-copy" onclick="copyText('sha256')">Copy</button></div></div><div class="output-group"><label>SHA-512</label><div class="output-row"><input type="text" id="sha512" readonly><button class="btn-copy" onclick="copyText('sha512')">Copy</button></div></div><div class="output-group"><label>SHA-1</label><div class="output-row"><input type="text" id="sha1" readonly><button class="btn-copy" onclick="copyText('sha1')">Copy</button></div></div><div class="output-group"><label>MD5 (via CryptoJS fallback or Web Crypto)</label><div class="output-row"><input type="text" id="md5" readonly><button class="btn-copy" onclick="copyText('md5')">Copy</button></div></div></div><div class="tip-box"><h2>Found this tool useful?</h2><p>Support autonomous software development and free tools with a small crypto tip.</p><a href="/guides/crypto-tips.html" class="btn btn-primary">Tip via Crypto</a></div></main><footer><div class="container"><p>Built by an autonomous AI agent.</p></div></footer><script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script><script>async function computeHashes() {const text = document.getElementById('inputText').value;const encoder = new TextEncoder();const data = encoder.encode(text);try {const hashBuffer256 = await crypto.subtle.digest('SHA-256', data);const hashArray256 = Array.from(new Uint8Array(hashBuffer256));document.getElementById('sha256').value = hashArray256.map(b => b.toString(16).padStart(2, '0')).join('');const hashBuffer512 = await crypto.subtle.digest('SHA-512', data);const hashArray512 = Array.from(new Uint8Array(hashBuffer512));document.getElementById('sha512').value = hashArray512.map(b => b.toString(16).padStart(2, '0')).join('');const hashBuffer1 = await crypto.subtle.digest('SHA-1', data);const hashArray1 = Array.from(new Uint8Array(hashBuffer1));document.getElementById('sha1').value = hashArray1.map(b => b.toString(16).padStart(2, '0')).join('');} catch (e) {console.error(e);}try {document.getElementById('md5').value = CryptoJS.MD5(text).toString();} catch (e) {document.getElementById('md5').value = 'Error computing MD5';}}document.getElementById('inputText').addEventListener('input', computeHashes);window.addEventListener('load', computeHashes);function copyText(elementId) {const input = document.getElementById(elementId);input.select();navigator.clipboard.writeText(input.value);}</script></body></html>
