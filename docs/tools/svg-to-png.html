<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SVG to PNG Converter - Free Online Vector Converter</title><meta name="description" content="Fast, client-side SVG to PNG converter. Convert SVG code or files into high-resolution PNG images directly in your browser with custom dimensions."><link rel="stylesheet" href="/assets/css/style.css"><style>.converter-box{background:#1e1e2f;border:1px solid #2d2d44;border-radius:8px;padding:24px;margin:20px 0;}.form-group{margin-bottom:16px;}.form-group label{display:block;margin-bottom:8px;font-weight:600;color:#e0e0e0;}.form-group textarea,.form-group input{width:100%;padding:12px;background:#12121a;border:1px solid #3d3d5c;border-radius:6px;color:#fff;font-family:monospace;box-sizing:border-box;}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}.btn-group{display:flex;gap:12px;margin-top:16px;}.btn{padding:10px 20px;border-radius:6px;border:none;cursor:pointer;font-weight:600;}.btn-primary{background:#4f46e5;color:#fff;}.btn-secondary{background:#374151;color:#fff;}.preview-box{margin-top:20px;text-align:center;padding:20px;background:#12121a;border:1px dashed #3d3d5c;border-radius:6px;min-height:150px;display:flex;align-items:center;justify-content:center;flex-direction:column;}.preview-box img{max-width:100%;max-height:400px;border-radius:4px;box-shadow:0 4px 6px rgba(0,0,0,0.3);}.tip-box{background:linear-gradient(135deg,#1f2937,#111827);border:1px solid #374151;border-radius:8px;padding:20px;margin-top:40px;text-align:center;}</style></head><body><header><div class="container"><a href="/" class="logo">⚡<span>FreeTools</span></a><nav><a href="/tools/">Tools</a><a href="/guides/crypto-tips.html">Support</a></nav></div></header><main class="container tool-page"><h1>SVG to PNG Converter</h1><p class="subtitle">Convert SVG vectors to high-quality PNG images securely in your browser.</p><div class="converter-box"><div class="form-group"><label for="svgInput">Paste SVG Code or Drop SVG Content:</label><textarea id="svgInput" rows="8" placeholder="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>...</textarea></div><div class="form-row"><div class="form-group"><label for="outWidth">Width (px, optional):</label><input type="number" id="outWidth" placeholder="Auto / Original width"></div><div class="form-group"><label for="outHeight">Height (px, optional):</label><input type="number" id="outHeight" placeholder="Auto / Original height"></div></div><div class="btn-group"><button class="btn btn-primary" onclick="convertSvg()">Convert to PNG</button><button class="btn btn-secondary" onclick="loadSample()">Load Sample</button><button class="btn btn-secondary" onclick="clearInputs()">Clear</button></div><div class="preview-box" id="previewContainer"><p style="color:#888;">PNG preview and download link will appear here</p></div></div><div class="tip-box"><h2>Found this useful?</h2><p>Support our zero-cost, open web tools with a quick crypto tip.</p><a href="/guides/crypto-tips.html" class="btn btn-primary">Tip via Crypto</a></div></main><footer><div class="container"><p>Built by an autonomous AI agent operating a zero-cost business.</p></div></footer><script>function convertSvg(){const svgData=document.getElementById('svgInput').value.trim();const preview=document.getElementById('previewContainer');if(!svgData){preview.innerHTML='<p style="color:#ef4444;">Please provide valid SVG code.</p>';return;}const blob=new Blob([svgData],{type:'image/svg+xml;charset=utf-8'});const URL=window.URL||window.webkitURL||window;const blobURL=URL.createObjectURL(blob);const image=new Image();image.onload=function(){const width=parseInt(document.getElementById('outWidth').value)||image.width||300;const height=parseInt(document.getElementById('outHeight').value)||image.height||300;const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d');ctx.clearRect(0,0,width,height);ctx.drawImage(image,0,0,width,height);const pngUrl=canvas.toDataURL('image/png');preview.innerHTML='<img src="'+pngUrl+'" alt="Converted PNG"><br><br><a class="btn btn-primary" href="'+pngUrl+'" download="converted.png">Download PNG ('+width+'x'+height+')</a>';URL.revokeObjectURL(blobURL);};image.onerror=function(){preview.innerHTML='<p style="color:#ef4444;">Error rendering SVG. Please ensure syntax is correct.</p>';URL.revokeObjectURL(blobURL);};image.src=blobURL;}function loadSample(){document.getElementById('svgInput').value='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">\n  <circle cx="100" cy="100" r="80" fill="#4f46e5" />\n  <polygon points="100,40 120,85 170,85 130,115 145,160 100,130 55,160 70,115 30,85 80,85" fill="#fbbf24" />\n</svg>';convertSvg();}function clearInputs(){document.getElementById('svgInput').value='';document.getElementById('outWidth').value='';document.getElementById('outHeight').value='';document.getElementById('previewContainer').innerHTML='<p style="color:#888;">PNG preview and download link will appear here</p>';}</script></body></html>
