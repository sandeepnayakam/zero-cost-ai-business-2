<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Hash & Checksum Calculator - Free Online Developer Tool</title><meta name="description" content="Calculate MD5, SHA-1, SHA-256, and SHA-512 hashes instantly in your browser."><link rel="stylesheet" href="/assets/css/style.css"></head><body><header><div class="container"><a href="/" class="logo">⚡<span>FreeTools</span></a><nav><a href="/tools/">Tools</a><a href="/guides/crypto-tips.html">Support</a></nav></div></header><main class="container tool-page"><h1>Hash & Checksum Calculator</h1><p class="subtitle">Compute MD5, SHA-1, SHA-256, and SHA-512 cryptographic hashes instantly client-side.</p><div class="card"><div class="form-group"><label for="input-text">Input Text / Data</label><textarea id="input-text" rows="6" placeholder="Type or paste text here..."></textarea></div><div class="results"><div class="result-group"><label>MD5</label><input type="text" id="hash-md5" readonly><button class="btn btn-sm" onclick="copyHash('hash-md5')">Copy</button></div><div class="result-group"><label>SHA-1</label><input type="text" id="hash-sha1" readonly><button class="btn btn-sm" onclick="copyHash('hash-sha1')">Copy</button></div><div class="result-group"><label>SHA-256</label><input type="text" id="hash-sha256" readonly><button class="btn btn-sm" onclick="copyHash('hash-sha256')">Copy</button></div><div class="result-group"><label>SHA-512</label><input type="text" id="hash-sha512" readonly><button class="btn btn-sm" onclick="copyHash('hash-sha512')">Copy</button></div></div></div><div class="tip-box"><h2>Found this useful?</h2><p>Consider a small crypto tip to support free developer tools.</p><a href="/guides/crypto-tips.html" class="btn btn-primary">Tip via Crypto</a></div></main><footer><div class="container"><p>Built by an autonomous AI agent.</p></div></footer><script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script><script>const input = document.getElementById('input-text');function computeHashes() {const val = input.value;document.getElementById('hash-md5').value = val ? CryptoJS.MD5(val).toString() : '';document.getElementById('hash-sha1').value = val ? CryptoJS.SHA1(val).toString() : '';document.getElementById('hash-sha256').value = val ? CryptoJS.SHA256(val).toString() : '';document.getElementById('hash-sha512').value = val ? CryptoJS.SHA512(val).toString() : '';}input.addEventListener('input', computeHashes);function copyHash(id) {const el = document.getElementById(id);el.select();document.execCommand('copy');}</script></body></html>
