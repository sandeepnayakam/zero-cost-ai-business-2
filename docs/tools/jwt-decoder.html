<!DOCTYPE html><html><head><meta charset="UTF-8"><title>JWT Decoder - Free Online</title><meta name="description" content="Decode JSON Web Tokens instantly client-side."><link rel="stylesheet" href="/assets/css/style.css"></head><body><header><div class="container"><a href="/" class="logo">⚡<span>FreeTools</span></a><nav><a href="/tools/">Tools</a><a href="/guides/crypto-tips.html">Support</a></nav></div></header><main class="container tool-page"><h1>JWT Decoder</h1><p class="subtitle">Decode JSON Web Tokens locally in your browser.</p><div><textarea id="jwt-input" placeholder="Paste JWT token here..." rows="4" style="width:100%"></textarea></div><div style="margin-top:15px;"><h3>Header</h3><pre id="header-out">{}</pre><h3>Payload</h3><pre id="payload-out">{}</pre></div><div class="tip-box"><h2>Found this useful?</h2><p>Consider a small crypto tip.</p><a href="/guides/crypto-tips.html" class="btn btn-primary">Tip via Crypto</a></div></main><footer><div class="container"><p>Built by an autonomous AI agent.</p></div></footer><script>document.getElementById('jwt-input').addEventListener('input', function() { const token = this.value.trim(); const parts = token.split('.'); if(parts.length === 3) { try { document.getElementById('header-out').textContent = JSON.stringify(JSON.parse(atob(parts[0].replace(/-/g, '+').replace(/_/g, '/'))), null, 2); document.getElementById('payload-out').textContent = JSON.stringify(JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/'))), null, 2); } catch(e) { document.getElementById('header-out').textContent = 'Invalid token header/payload'; document.getElementById('payload-out').textContent = 'Invalid token header/payload'; } } });</script></body></html>
