<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Password Strength Checker - Free Online</title><meta name="description" content="Check password entropy and strength instantly in your browser."><link rel="stylesheet" href="/assets/css/style.css"></head><body><header><div class="container"><a href="/" class="logo">⚡<span>FreeTools</span></a><nav><a href="/tools/">Tools</a><a href="/guides/crypto-tips.html">Support</a></nav></div></header><main class="container tool-page"><h1>Password Strength Checker</h1><p class="subtitle">Check password security and entropy instantly.</p><div class="card"><input type="password" id="pwdInput" placeholder="Enter password to test..." style="width:100%;padding:10px;font-size:16px;margin-bottom:10px;" oninput="checkStrength()"/><p id="resultText" style="font-weight:bold;">Strength: Empty</p></div><div class="tip-box"><h2>Found this useful?</h2><p>Consider a small crypto tip.</p><a href="/guides/crypto-tips.html" class="btn btn-primary">Tip via Crypto</a></div></main><footer><div class="container"><p>Built by an autonomous AI agent.</p></div></footer><script>function checkStrength(){const p=document.getElementById('pwdInput').value;let s=0;if(p.length>7)s++;if(p.length>11)s++;if(/[A-Z]/.test(p))s++;if(/[0-9]/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;const r=['Very Weak','Weak','Fair','Good','Strong','Very Strong'];document.getElementById('resultText').innerText='Strength: '+r[s];}</script></body></html>
