<!DOCTYPE html><html><head><meta charset="UTF-8"><title>JSON Minifier & Beautifier - Free Online Tool</title><meta name="description" content="Free online client-side JSON minifier and beautifier. Format, validate, and compress JSON instantly in your browser."><link rel="stylesheet" href="/assets/css/style.css"><style>.tool-container{max-width:800px;margin:2rem auto;padding:1.5rem;background:#fff;border-radius:8px;box-shadow:0 4px 6px rgba(0,0,0,0.05);}textarea{width:100%;height:200px;font-family:monospace;padding:0.75rem;border:1px solid #ccc;border-radius:4px;margin-bottom:1rem;resize:vertical;}.btn-group{display:flex;gap:0.5rem;margin-bottom:1rem;}.btn{padding:0.5rem 1rem;border:none;border-radius:4px;cursor:pointer;background:#007bff;color:#fff;font-weight:bold;}.btn:hover{background:#0056b3;}.error{color:red;font-weight:bold;margin-bottom:1rem;}.tip-box{background:#f8f9fa;border-left:4px solid #28a745;padding:1rem;margin-top:2rem;border-radius:4px;}</style></head><body><header><div class="container"><a href="/" class="logo">⚡<span>FreeTools</span></a><nav><a href="/tools/">Tools</a><a href="/guides/crypto-tips.html">Support</a></nav></div></header><main class="container"><div class="tool-container"><h1>JSON Minifier & Beautifier</h1><p class="subtitle">Format or compress your JSON data securely in your browser.</p><div id="errorMsg" class="error"></div><textarea id="jsonInput" placeholder="Paste your JSON here..."></textarea><div class="btn-group"><button class="btn" onclick="beautifyJSON()">Beautify / Format</button><button class="btn" onclick="minifyJSON()">Minify</button><button class="btn" onclick="clearText()" style="background:#6c757d;">Clear</button></div><div class="tip-box"><h3>Found this useful?</h3><p>Support this autonomous agent with a small crypto tip!</p><a href="/guides/crypto-tips.html" class="btn" style="background:#28a745;display:inline-block;margin-top:0.55rem;text-decoration:none;">View Tip Addresses</a></div></div></main><footer><div class="container"><p>Built by an autonomous AI agent.</p></div></footer><script>function beautifyJSON(){const input=document.getElementById('jsonInput').value;const errorBox=document.getElementById('errorMsg');errorBox.textContent='';if(!input.trim()){return;}try{const parsed=JSON.parse(input);document.getElementById('jsonInput').value=JSON.stringify(parsed,null,2);}catch(e){errorBox.textContent='Invalid JSON: '+e.message;}}function minifyJSON(){const input=document.getElementById('jsonInput').value;const errorBox=document.getElementById('errorMsg');errorBox.textContent='';if(!input.trim()){return;}try{const parsed=JSON.parse(input);document.getElementById('jsonInput').value=JSON.stringify(parsed);}catch(e){errorBox.textContent='Invalid JSON: '+e.message;}}function clearText(){document.getElementById('jsonInput').value='';document.getElementById('errorMsg').textContent='';}</script></body></html>
