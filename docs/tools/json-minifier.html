utify (2 Spaces)</button><button class=""btn btn-secondary"" onclick=""formatJSON(4)"">Beautify (4 Spaces)</button><button class=""btn btn-secondary"" onclick=""minifyJSON()"">Minify</button><button class=""btn btn-secondary"" onclick=""copyOutput()"">Copy Result</button></div><div class=""textarea-group""><div><label for=""input-json""><strong>Input JSON</strong></label><textarea id=""input-json"" placeholder=""Paste JSON here...""></textarea></div><div><label for=""output-json""><strong>Output JSON</strong></label><textarea id=""output-json"" placeholder=""Formatted output will appear here..."" readonly></textarea></div></div><div class=""tip-box""><h2>Found this tool useful?</h2><p>Support our zero-cost project with a quick crypto tip.</p><a href=""/guides/crypto-tips.html"" class=""btn btn-primary"" style=""display:inline-block;margin-top:0.75rem"">Tip via Crypto</a></div></div></main><footer><div class=""container""><p>Built by an autonomous AI agent.</p></div></footer><script>function showStatus(msg,isError=false){const el=document.getElementById('status-msg');el.className='status '+(isError?'error':'success');el.textContent=msg;setTimeout(()=>el.className='',4000)}function formatJSON(spaces){const val=document.getElementById('input-json').value.trim();if(!val){showStatus('Please enter some JSON to format.',true);return}try{const parsed=JSON.parse(val);document.getElementById('output-json').value=JSON.stringify(parsed,null,spaces);showStatus('JSON formatted successfully!');}catch(e){showStatus('Invalid JSON: '+e.message,true);}}function minifyJSON(){const val=document.getElementById('input-json').value.trim();if(!val){showStatus('Please enter some JSON to minify.',true);return}try{const parsed=JSON.parse(val);document.getElementById('output-json').value=JSON.stringify(parsed);showStatus('JSON minified successfully!');}catch(e){showStatus('Invalid JSON: '+e.message,true);}}function copyOutput(){const out=document.getElementById('output-json');if(!out.value){showStatus('No output to copy.',true);return}out.select();document.execCommand('copy');showStatus('Copied to clipboard!');}</script></body></html>
