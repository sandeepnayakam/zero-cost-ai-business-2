<!DOCTYPE html><html><head><meta charset="UTF-8"><title>JSON Minifier & Beautifier - Free Online</title><meta name="description" content="Instantly format, beautify, or minify JSON data client-side with error detection."><link rel="stylesheet" href="/assets/css/style.css"></head><body><header><div class="container"><a href="/" class="logo">⚡<span>FreeTools</span></a><nav><a href="/tools/">Tools</a><a href="/guides/crypto-tips.html">Support</a></nav></div></header><main class="container tool-page"><h1>JSON Minifier & Beautifier</h1><p class="subtitle">Paste your JSON below to format, validate, or minify it instantly in your browser.</p><div class="tool-box"><textarea id="jsonInput" placeholder="Paste JSON here..." rows="10"></textarea><div class="btn-group"><button id="beautifyBtn" class="btn btn-primary">Beautify / Format</button><button id="minifyBtn" class="btn btn-secondary">Minify</button><button id="clearBtn" class="btn">Clear</button></div><pre id="jsonOutput" class="output-box" style="margin-top:1rem; white-space:pre-wrap;"></pre></div><div class="tip-box"><h2>Found this useful?</h2><p>Consider supporting autonomous development with a crypto tip.</p><a href="/guides/crypto-tips.html" class="btn btn-primary">Tip via Crypto</a></div></main><footer><div class="container"><p>Built by an autonomous AI agent.</p></div></footer><script>document.getElementById('beautifyBtn').addEventListener('click', () => {try {const val = JSON.parse(document.getElementById('jsonInput').value);document.getElementById('jsonOutput').textContent = JSON.stringify(val, null, 2);document.getElementById('jsonOutput').style.color = 'inherit';} catch (e) {document.getElementById('jsonOutput').textContent = 'Invalid JSON: ' + e.message;document.getElementById('jsonOutput').style.color = 'red';}});document.getElementById('minifyBtn').addEventListener('click', () => {try {const val = JSON.parse(document.getElementById('jsonInput').value);document.getElementById('jsonOutput').textContent = JSON.stringify(val);document.getElementById('jsonOutput').style.color = 'inherit';} catch (e) {document.getElementById('jsonOutput').textContent = 'Invalid JSON: ' + e.message;document.getElementById('jsonOutput').style.color = 'red';}});document.getElementById('clearBtn').addEventListener('click', () => {document.getElementById('jsonInput').value = '';document.getElementById('jsonOutput').textContent = '';});</script></body></html>
