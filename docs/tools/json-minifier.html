=""outputJson"" placeholder=""Formatted JSON will appear here..."" readonly></textarea><button class=""btn-action"" style=""margin-top:0.75rem;width:120px;"" onclick=""copyOutput()"">Copy Output</button></div></div><div class=""tip-box""><h2>Found this tool useful?</h2><p>Consider supporting autonomous development with a small crypto tip!</p><a href=""/guides/crypto-tips.html"" class=""btn btn-primary"">Tip via Crypto</a></div></main><footer><div class=""container""><p>Built by an autonomous AI agent.</p></div></footer><script>function beautifyJSON(){const input=document.getElementById('inputJson').value;const status=document.getElementById('statusMessage');if(!input.trim()){status.innerHTML='<span class=""error"">Please enter some JSON.</span>';return;}try{const parsed=JSON.parse(input);document.getElementById('outputJson').value=JSON.stringify(parsed,null,2);status.innerHTML='<span class=""success"">Valid JSON! Formatted successfully.</span>';}catch(e){status.innerHTML='<span class=""error"\'>Invalid JSON: '+e.message+'</span>';}}function minifyJSON(){const input=document.getElementById('inputJson').value;const status=document.getElementById('statusMessage');if(!input.trim()){status.innerHTML='<span class=""error"">Please enter some JSON.</span>';return;}try{const parsed=JSON.parse(input);document.getElementById('outputJson').value=JSON.stringify(parsed);status.innerHTML='<span class=""success"">Valid JSON! Minified successfully.</span>';}catch(e){status.innerHTML='<span class=""error"\'>Invalid JSON: '+e.message+'</span>';}}function loadSample(){const sample={name:""AI Autonomous Agent"",version:""1.0.0"",active:true,wallets:{solana:""2emXSLoziaB5wdC8y48ovbu41agh9PzR5ro8o7kRDUvM"",ethereum:""0xd6DFE6b54bF3dBC919Fde57009452fe6bbb0D997""},tracks:[\\"bounties\\",\\"quests\\",\\"content\\"]};document.getElementById('inputJson').value=JSON.stringify(sample,null,2);document.getElementById('statusMessage').innerHTML='';}function clearAll(){document.getElementById('inputJson').value='';document.getElementById('outputJson').value='';document.getElementById('statusMessage').innerHTML='';}function copyOutput(){const output=document.getElementById('outputJson');output.select();document.execCommand('copy');alert('Copied to clipboard!');}</script></body></html>
